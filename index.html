document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ходы<\u002Fdiv>\n<div style=\"font-size:14.5px;color:rgba(234,240,250,.6);line-height:1.55;margin-top:10px;text-wrap:pretty\">Выбирай победителя матча или ничью — за верный прогноз получаешь очки. Чем менее популярный исход угадал, тем больше очков.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"{{ obS1 }}\">\n<div style=\"height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px\">\n<div style=\"width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#3DDC97 68%,rgba(255,255,255,.1) 0);box-shadow:0 0 40px rgba(61,220,151,.18)\">\n<div style=\"width:92px;height:92px;border-radius:50%;background:#10264A;display:flex;flex-direction:column;align-items:center;justify-content:center\"><span style=\"font-size:9.5px;letter-spacing:1.4px;font-weight:700;color:rgba(234,240,250,.45)\">УРОВЕНЬ<\u002Fspan><span style=\"font-size:34px;font-weight:800;line-height:1.05\">4<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:320px\">\n<span style=\"display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;font-size:11px;font-weight:700;color:#CD8B5A;background:#CD8B5A14;border:1px solid #CD8B5A33;opacity:0.6\"><span style=\"width:7px;height:7px;border-radius:50%;background:#CD8B5A\"><\u002Fspan>Бронза<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;font-size:11px;font-weight:700;color:#C9D3E0;background:#C9D3E02e;border:1px solid #C9D3E080;opacity:1\"><span style=\"width:7px;height:7px;border-radius:50%;background:#C9D3E0\"><\u002Fspan>Серебро<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;font-size:11px;font-weight:700;color:#F2C94C;background:#F2C94C14;border:1px solid #F2C94C33;opacity:0.6\"><span style=\"width:7px;height:7px;border-radius:50%;background:#F2C94C\"><\u002Fspan>З nter;color:#3DDC97;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.25)\"><span style=\"font-size:17px;font-weight:800;letter-spacing:-.5px\">×2<\u002Fspan><\u002Fdiv><span style=\"font-size:10.5px;font-weight:600;color:rgba(234,240,250,.5)\">Удвоитель<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#3DDC97;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.25)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z\"><\u002Fpath><path d=\"M8.5 12l2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span style=\"font-size:10.5px;font-weight:600;color:rgba(234,240,250,.5)\">Страховка<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-top:26px\">Зарабатывай монеты<\u002Fdiv>\n<div style=\"font-size:14.5px;color:rgba(234,240,250,.6);line-height:1.55;margin-top:10px;text-wrap:pretty\">Монеты идут за участие, даже когда прогноз не зашёл. Трать их на усилители.<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;margin-top:20px;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(245,197,66,.2),rgba(245,197,66,.05) 65%),#10264A;border:1px solid rgba(245,197,66,.45);box-shadow:0 14px 34px rgba(0,0,0,.35)\">\n<span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3 0,#F5C542 45%,#C8901E 100%);box-shadow:inset 0 0 0 4.4px rgba(140,90,10,.55),0 1px 3px rgba(0,0,0,.4)\"><\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:17px;font-weight:800;color:#F5D06B\">Держи 300 монет на старт<\u002Fspan><span style=\"font-size:12px;color:rgba(234,240,250,.6)\">Хватит на удвоитель и страховку<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:0 22px;display:flex;flex-direction:column;gap:18px;align-items:center\">\n<div style=\"display:flex;gap:6px\"><sc-for list=\"{{ obDots }}\" as=\"d\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\"><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<button sc-camel-on-click=\"{{ obNext }}\" style=\"width:100%;padding:17px;border-radius:16px;border:none;background:#3DDC97;color:#052013;font-family:Manrope,sans-serif;font-size:16px;font-weight:800;cursor:pointer\" style-active=\"transform:scale(.98)\">{{ obBtn }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;display:flex;flex-direction:column\">\n\n<div style=\"padding:52px 10px 12px;background:#0B1B34;border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:20\">\n<div style=\"display:flex;align-items:center;justify-content:space-between\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<div style=\"width:30px;height:30px;border-radius:10px;background:#0F2547;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff\">S<\u002Fdiv>\n<button sc-camel-on-click=\"{{ toggleSport }}\" style=\"display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;color:#EAF0FA;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:pointer\">{{ sport }}<span style=\"font-size:9px;opacity:.6\">▼<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ openShop }}\" style=\"{{ coinChipStyle }}\">\n<span style=\"flex:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3 0,#F5C542 45%,#C890 <div style=\"position:relative;display:flex;gap:4px;margin-top:16px;padding:4px;background:rgba(255,255,255,.06);border-radius:14px\">\n<div style=\"{{ listPill }}\"><\u002Fdiv>\n<sc-for list=\"{{ listTabs }}\" as=\"lt\" hint-placeholder-count=\"3\">\n<button sc-camel-on-click=\"{{ lt.pick }}\" style=\"{{ lt.style }}\" style-active=\"transform:scale(.94)\">{{ lt.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:11px;letter-spacing:1.6px;color:rgba(234,240,250,.4);font-weight:700;margin:20px 0 10px\">{{ listLabel }}<\u002Fdiv>\n<sc-if value=\"{{ favEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px dashed rgba(255,255,255,.16);border-radius:18px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center\">\n<div style=\"font-size:26px;color:rgba(234,240,250,.3)\">☆<\u002Fdiv>\n<div style=\"font-size:14px;font-weight:700\">Пока пусто<\u002Fdiv>\n<div style=\"font-size:12px;color:rgba(234,240,250,.45);line-height:1.5\">Нажми звёздочку рядом с турниром во «Всех турнирах», чтобы он появился здесь.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ tourList }}\" as=\"t\" hint-placeholder-count=\"8\">\n<div style=\"display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:6px 6px 6px 12px\">\n<button sc-camel-on-click=\"{{ t.open }}\" style=\"display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:none;padding:8px 0;color:#EAF0FA;font-family:Manrope,sans-serif;cursor:pointer;text-align:left\">\n<span style=\"width:20px;font-size:12px;font-weight:800;color:rgba(234,240,250,.4);text-align:center\">{{ t.rank }}<\u002Fspan>\n<div style=\"{{ t.badgeStyle }}\">{{ t.abbr }}<\u002Fdiv>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.name }}<\u002Fspan><span style=\"font-size:11px;color:rgba(234,240,250,.45)\">{{ t.meta }}<\u002Fspan><\u002Fdiv>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ t.toggleFav }}\" style=\"{{ t.favStyle }}\">{{ t.favIcon }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMatchList }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:pageIn .3s cubic-bezier(.2,.8,.3,1) both;padding:14px 10px 30px\">\n<button sc-camel-on-click=\"{{ backToLeagues }}\" style=\"display:flex;align-items:center;gap:8px;background:none;border:none;color:rgba(234,240,250,.6);font-size:13px;font-family:Manrope,sans-serif;cursor:pointer;padding:6px 0\">‹ Назад<\u002Fbutton>\n<div style=\"display:flex;align-items:center;gap:12px;margin-top:8px\"><sc-if value=\"{{ openHasLogo }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ openLogoStyle }}\"><\u002Fspan><\u002Fsc-if><div style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><span style=\"font-size:22px;font-weight:800;line-height:1.15\">{{ openName }}<\u002Fspan><span style=\"font-size:12px;color:rgba(234,240,250,.45)\">{{ openMeta }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative;display:flex;gap:4px;margin-top:16px;padding:4px;background:rgba(255,255,255,.06);border-radius:14px\">\n<div style=\"{{ tPill }}\"><\u002Fdiv>\n<sc-for list=\"{{ tTabs }}\" as=\"tt\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ tt.pick }}\" style=\"{{ tt.style }}\" style-active=\"transform:scale(.94)\">{{ tt.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ isTUp }}\" hint-placeholder-val=\"{{ true }}\">\n<sc-if value=\"{{ hasTour }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"{{ tourBoxStyle }}\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%, ding:8px 12px;border-radius:10px;border:1px dashed rgba(255,255,255,.2);background:transparent;color:rgba(234,240,250,.7);font-family:Manrope,sans-serif;font-size:12.5px;font-weight:700;cursor:pointer\">{{ lgLink }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ lgHasTable }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden\">\n<div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 44px 48px;gap:8px;padding:11px 12px;font-size:10px;letter-spacing:1.1px;font-weight:700;color:rgba(234,240,250,.45);border-bottom:1px solid rgba(255,255,255,.08)\">\n<span>#<\u002Fspan><span>ИГРОК<\u002Fspan><span style=\"text-align:center\">УР.<\u002Fspan><span style=\"text-align:right\">ОЧКИ<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ lgRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"{{ r.rowStyle }}\">\n<span style=\"{{ r.rankStyle }}\">{{ r.rank }}<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:9px;min-width:0\"><span style=\"{{ r.avaStyle }}\">{{ r.initial }}<\u002Fspan><span style=\"font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:12px;font-weight:800;text-align:center;padding:3px 0;border-radius:8px;background:rgba(255,255,255,.07)\">{{ r.level }}<\u002Fspan>\n<span style=\"font-size:14px;font-weight:800;text-align:right;color:#3DDC97\">{{ r.pts }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ shareLeague }}\" style=\"width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;border:none;background:#3DDC97;color:#052013;font-family:Manrope,sans-serif;font-size:15px;font-weight:800;cursor:pointer\" style-active=\"transform:scale(.98)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V3\"><\u002Fpath><path d=\"M7 8l5-5 5 5\"><\u002Fpath><path d=\"M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6\"><\u002Fpath><\u002Fsvg><span>Пригласить<\u002Fspan><\u002Fbutton>\n<div style=\"text-align:center;font-size:11px;color:rgba(234,240,250,.42);margin-top:8px\">{{ lgLink }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:tabIn .28s ease both;padding:80px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px\">\n<div style=\"width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)\"><\u002Fdiv>\n<div style=\"font-size:19px;font-weight:800\">{{ tab }}<\u002Fdiv>\n<div style=\"font-size:13px;color:rgba(234,240,250,.45);line-height:1.5\">{{ stubText }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<div style=\"display:flex;background:#081327;border-top:1px solid rgba(255,255,255,.08);padding:10px 6px 26px\">\n<sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n<button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\" style-active=\"transform:scale(.88)\"><span style=\"{{ t.dotStyle }}\"><\u002Fspan>{{ t.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;z-index:75\">\n<div sc-camel-on-click=\"{{ closeHelp }}\" style=\"{{ helpDimStyle }}\"><\u002Fdiv>\n<div style=\"{{ helpPanelStyle }}\">\n<div style=\"width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 16px\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px\">\n<span style=\"flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#F5D06B;background:rgba(245,197,66,.14)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"><\u002Fpath><path d=\"M10 21h4\"><\u002Fpath><path d=\"M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"font-size:19px;font-weight:800\">Как считаются очки<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:12.5px;color:rgba(234,240,250,.55);margin-top:8px;line-height:1.5\">Это не букмекерские коэффициенты — ставок на деньги нет. Числа показывают, сколько очков принесёт верный прогноз.<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n<div style=\"display:flex;gap:12px;padding:12px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\">\n<span style=\"flex:none;min-width:44px;height:30px;padding:0 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#3DDC97;background:rgba(61,220,151,.12)\">46%<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:13.5px;font-weight:700\">Доля выбравших<\u002Fspan><span style=\"font-size:12px;color:rgba(234,240,250,.55);line-height:1.45\">Сколько игроков поставили на этот исход. Полоска показывает то же самое.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:12px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\">\n<span style=\"flex:none;min-width:44px;height:30px;padding:0 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#3DDC97;background:rgba(61,220,151,.12)\">×1.4<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:13.5px;font-weight:700\">Множитель сложности<\u002Fspan><span style=\"font-size:12px;color:rgba(234,240,250,.55);line-height:1.45\">От ×1.0 до ×2.5. Чем меньше людей выбрали исход, тем выше множитель. Фиксируется в момент старта матча.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:12px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\">\n<span style=\"flex:none;min-width:44px;height:30px;padding:0 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#3DDC97;background:rgba(61,220,151,.12)\">×1.5<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:13.5px;font-weight:700\">Бонус серии<\u002Fspan><span style=\"font-size:12px;color:rgba(234,240,250,.55);line-height:1.45\">3 верных подряд — ×1.5, 5 подряд — ×2. Первый промах обнуляет серию.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:12px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\">\n<span style=\"flex:none;min-width:44px;height:30px;padding:0 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#3DDC97;background:rgba(61,220,151,.12)\">50+<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:13.5px;font-weight:700\">Минимум прогнозов<\u002Fspan><span style=\"font-size:12px;color:rgba(234,240,250,.55);line-height:1.45\">Пока по матчу меньше 50 прогнозов, множитель ×1.0 — выборка ещё мала.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:12px;padding:14px;border-radius:16px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35)\">\n<div style=\"font-size:10.5px;letter-spacing:1.3px;font-weight:700;color:rgba(234,240,250,.5)\">ФОРМУЛА<\u002Fdiv>\n<div style=\"font-size:15px;font-weight:800;margin-top:6px\">3 × сложность × серия<\u002Fdiv>\n<div style=\"font-size: ze:13px;color:rgba(234,240,250,.6);margin-top:8px;line-height:1.5\">Таблица пропадёт у всех участников. Очки сезона у игроков останутся. Отменить нельзя.<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:18px\">\n<button sc-camel-on-click=\"{{ cancelDelete }}\" style=\"flex:1;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#EAF0FA;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:pointer\">Отмена<\u002Fbutton>\n<button sc-camel-on-click=\"{{ confirmDelete }}\" style=\"flex:1;padding:14px;border-radius:14px;border:none;background:#FF6B6B;color:#2A0505;font-family:Manrope,sans-serif;font-size:14px;font-weight:800;cursor:pointer\">Удалить<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ dailyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;top:0;left:0;right:0;bottom:76px;z-index:88;display:flex;align-items:center;justify-content:center;padding:18px\">\n<div sc-camel-on-click=\"{{ closeDaily }}\" style=\"position:absolute;inset:0;background:rgba(3,8,18,.66);animation:dim .2s ease both\"><\u002Fdiv>\n<div style=\"position:relative;width:100%;background:#12294C;border:1px solid rgba(245,197,66,.3);border-radius:26px;padding:20px 14px 18px;animation:popIn .22s ease both;box-shadow:0 30px 70px rgba(0,0,0,.55)\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3 0,#F5C542 45%,#C8901E 100%);box-shadow:inset 0 0 0 3.8px rgba(140,90,10,.55),0 1px 3px rgba(0,0,0,.4)\"><\u002Fspan>\n<div><div style=\"font-size:19px;font-weight:800\">Ежедневный вход<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(234,240,250,.55);margin-top:2px\">{{ dailySub }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:18px\">\n<sc-for list=\"{{ dailyCells }}\" as=\"c\" hint-placeholder-count=\"7\">\n<div style=\"{{ c.style }}\"><span style=\"font-size:9.5px;font-weight:700;letter-spacing:.5px;opacity:.7\">{{ c.label }}<\u002Fspan><span style=\"font-size:15px;font-weight:800\">{{ c.amount }}<\u002Fspan><span style=\"font-size:10px;height:12px;line-height:12px\">{{ c.mark }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;color:rgba(234,240,250,.5);margin-top:12px;line-height:1.5;text-align:center\">Пропустишь день — лестница начнётся с первого дня. После 7-го дня цикл идёт заново.<\u002Fdiv>\n<button sc-camel-on-click=\"{{ claimDaily }}\" style=\"{{ dailyBtnStyle }}\" style-active=\"transform:scale(.98)\">{{ dailyBtn }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"{{ toastStyle }}\">\n<span style=\"width:22px;height:22px;border-radius:50%;background:#3DDC97;color:#052013;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800\">✓<\u002Fspan>\n<span style=\"font-size:13px;font-weight:700\">{{ toastText }}<\u002Fspan>\n<sc-if value=\"{{ toastHasDelta }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#F5D06B\">{{ toastDelta }}<span style=\"flex:none;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3 0,#F5C542 45%,#C8901E 100%);box-shadow:inset 0 0 0 1.5px rgba(140,90,10,.55),0 1px 3px rgba(0,0,0,.4)\"><\u002Fspan><\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;z-index:70\">\n<div sc-camel-on-click=\"{{ closeSheet }}\" style=\"{{ sheetDimStyle }}\"><\u002Fdiv>\n<div style=\"{{ sheetPanelStyle }}\">\n<div style=\"width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 16px\"><\u002F
